[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib", "dependencies"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=dependencies/openzeppelin-contracts/contracts/",
  "forge-std/=dependencies/forge-std/src/",
]

[fuzz]
runs = 256

# 0G networks (verify cancun support on testnet before mainnet deploy)
[rpc_endpoints]
zg_mainnet = "https://evmrpc.0g.ai"
zg_testnet = "https://evmrpc-testnet.0g.ai"
